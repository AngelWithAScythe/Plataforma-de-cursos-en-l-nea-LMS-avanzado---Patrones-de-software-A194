<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login</title>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script
	src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<link
	href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>
	<div class="container">
		<div class="login-container  mx-auto">
				<form th:action="@{/login}" class="form" method="post">
					<h1 th:text="Ingresar"></h1>
					<div class="form_container">
						<div class="form-group">
							<label for="nickname">Nombre de usuario</label> <input type="text"
								id="nickname" name="nickname" class="form-control" required>
						</div>

						<div class="form-group">
							<label for="contrasena">Contraseña</label> <input type="password"
								id="contrasena" name="contrasena" class="form-control" required>
						</div>

						<button type="submit" class="btn form_submit">Ingresar</button>
						<p th:if="${error}" th:text="${error}"></p>
					</div>
				</form>
			</th:block>
		</div>
	</div>
</body>
</html>
