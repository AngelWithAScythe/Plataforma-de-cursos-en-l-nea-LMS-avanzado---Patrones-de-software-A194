<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Contenido del curso</title>
<link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<div class="container" style="margin-top: 40px;">
		<h1>Contenido de <span th:text="${curso.contenido.titulo}"></span></h1>
		<p class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></p>
		<p class="alert alert-danger" th:if="${error}" th:text="${error}"></p>
		
		<form th:if="${editable}" th:action="@{/instructor/cursos/{id}/contenido/deshacer(id=${curso.id})}" method="post" class="mb-3">
			<button type="submit" class="btn btn-sm btn-outline-warning">↶ Deshacer última acción</button>
		</form>

		<div th:replace="~{fragments/modulo :: nodo(${curso}, ${curso.contenido.estructura}, ${editable})}"></div>

		<a th:href="${editable} ? @{/instructor/mis-cursos} : @{/estudiante/mis-cursos}" class="btn btn-secondary mt-3">Volver</a>
	</div>
</body>
</html>
