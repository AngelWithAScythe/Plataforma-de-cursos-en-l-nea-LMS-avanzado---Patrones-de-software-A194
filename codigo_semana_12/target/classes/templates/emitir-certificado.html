<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Emitir certificado</title>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<div class="container">
		<div class="mx-auto" style="max-width: 480px; margin-top: 40px;">
			<h1>Emitir certificado</h1>
			<p>
				Curso: <strong th:text="${curso.contenido.titulo}"></strong><br>
				Nota mínima de aprobación: <span th:text="${curso.evaluacion.notaMinimaAprobacion}"></span>
			</p>

			<form th:action="@{/instructor/cursos/{id}/certificado(id=${curso.id})}" method="post">
				<div class="form-group">
					<label for="nombreEstudiante">Nombre del estudiante</label>
					<input type="text" id="nombreEstudiante" name="nombreEstudiante" class="form-control" required>
				</div>

				<div class="form-group">
					<label for="nota">Nota obtenida</label>
					<input type="number" id="nota" name="nota" class="form-control" required>
				</div>

				<button type="submit" class="btn btn-primary">Emitir certificado</button>
			</form>

			<a th:href="@{/instructor/mis-cursos}" class="btn btn-secondary mt-2">Volver</a>
		</div>
	</div>
</body>
</html>
