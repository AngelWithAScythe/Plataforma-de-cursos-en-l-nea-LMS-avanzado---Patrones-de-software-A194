<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Notificaciones</title>
<link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<div class="container" style="margin-top: 40px;">
		<h1>Notificaciones</h1>

		<p th:if="${#lists.isEmpty(notificaciones)}" class="text-muted">No tienes notificaciones.</p>

		<ul class="list-group mb-3" th:unless="${#lists.isEmpty(notificaciones)}">
			<li class="list-group-item" th:each="n : ${notificaciones}"
				th:classappend="${nuevasIds.contains(n.id)} ? 'list-group-item-warning' : ''">
				<span th:text="${n.mensaje}"></span>
				<span class="badge badge-warning ml-2" th:if="${nuevasIds.contains(n.id)}">Nueva</span>
				<br><small class="text-muted" th:text="${n.fecha}"></small>
			</li>
		</ul>

		<a th:href="@{/home}" class="btn btn-secondary">Volver</a>
	</div>
</body>
</html>
