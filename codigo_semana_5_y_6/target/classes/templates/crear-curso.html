<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Crear curso</title>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<div class="container">
		<div class="mx-auto" style="max-width: 480px; margin-top: 40px;">
			<form th:action="@{/instructor/cursos}" method="post">
				<h1>Crear curso</h1>

				<p class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></p>

				<div class="form-group">
					<label for="tipo">Tipo de curso</label>
					<select id="tipo" name="tipo" class="form-control" required>
						<option value="">Selecciona un tipo</option>
						<option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
					</select>
				</div>

				<hr>
				<h5>Contenido</h5>
				<div class="form-group">
					<label for="tituloContenido">Título</label>
					<input type="text" id="tituloContenido" name="tituloContenido" class="form-control" required>
				</div>
				<div class="form-group">
					<label for="descripcionContenido">Descripción</label>
					<input type="text" id="descripcionContenido" name="descripcionContenido" class="form-control" required>
				</div>

				<hr>
				<h5>Evaluación</h5>
				<div class="form-group">
					<label for="nombreEvaluacion">Nombre</label>
					<input type="text" id="nombreEvaluacion" name="nombreEvaluacion" class="form-control" required>
				</div>
				<div class="form-group">
					<label for="notaMinima">Nota mínima de aprobación</label>
					<input type="number" id="notaMinima" name="notaMinima" class="form-control" required>
				</div>

				<hr>
				<h5>Certificado</h5>
				<div class="form-group">
					<label for="nombreCurso">Nombre del curso (para el certificado)</label>
					<input type="text" id="nombreCurso" name="nombreCurso" class="form-control" required>
				</div>
				<div class="form-group">
					<label for="codigoValidacion">Código de validación</label>
					<input type="text" id="codigoValidacion" name="codigoValidacion" class="form-control" required>
				</div>

				<button type="submit" class="btn btn-primary">Crear curso</button>
			</form>
		</div>
	</div>
</body>
</html>
