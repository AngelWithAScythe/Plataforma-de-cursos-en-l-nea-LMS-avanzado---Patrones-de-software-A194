<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Crear usuario</title>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script
	src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<link
	href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>
	<div class="container">
		<div class="login-container mx-auto" style="max-width: 480px; margin-top: 40px;">
			<form th:action="@{/admin/usuarios}" class="form" method="post">
				<h1>Crear usuario</h1>

				<p class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></p>
				<p class="alert alert-danger" th:if="${error}" th:text="${error}"></p>

				<div class="form_container">
					<div class="form-group">
						<label for="nombre">Nombre completo</label>
						<input type="text" id="nombre" name="nombre" class="form-control" required>
					</div>

					<div class="form-group">
						<label for="nickname">Nombre de usuario</label>
						<input type="text" id="nickname" name="nickname" class="form-control" required>
					</div>

					<div class="form-group">
						<label for="contrasena">Contraseña</label>
						<input type="password" id="contrasena" name="contrasena" class="form-control" required>
					</div>

					<div class="form-group">
						<label for="rol">Rol</label>
						<select id="rol" name="rol" class="form-control" required>
							<option value="">Selecciona un rol</option>
							<option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
						</select>
					</div>

					<button type="submit" class="btn btn-primary form_submit">Crear usuario</button>
				</div>
			</form>
		</div>
	</div>
</body>
</html>
